name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # the tests import the plugin's TypeScript directly (Node type stripping)
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # the build the marketplace runs, with the oldest bb this plugin supports (engines.bb)
      - run: npm exec --yes --package=bb-app@0.49.0 -- bb plugin build .
